<!DOCTYPE html>
<html lang="en" data-theme="light" data-bs-theme="light" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In | Family Planning Portal</title>
  <meta name="description" content="Sign in to your Fiesta Rosa Events family planning portal to track your Quinceañera or Sweet Sixteen countdown, vendors, checklist, and budget.">
  <link rel="icon" href="assets/img/icons/favicon.svg?v=4" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/icons/favicon-32x32.png?v=4">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/icons/favicon-16x16.png?v=4">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/icons/apple-touch-icon.png?v=4">
  <link rel="shortcut icon" href="assets/img/icons/favicon.ico?v=4">
  <link id="bsCss" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <script>
    (function () {
      var d = localStorage.getItem('dir') || 'ltr';
      var t = localStorage.getItem('theme') || 'light';
      var h = document.documentElement;
      h.dir = d;
      h.dataset.theme = t;
      h.dataset.bsTheme = t;
      h.classList.add('js');
      if (d === 'rtl') {
        var l = document.getElementById('bsCss');
        if (l) l.href = 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css';
      }
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      prefix: 'tw-',
      corePlugins: { preflight: false }
    };
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page auth-page-login" style="background-image: linear-gradient(135deg, rgba(20, 8, 32, 0.62), rgba(48, 12, 54, 0.58)), url('assets/img/hero/login.jpg');">
  <a class="skip-link" href="#main">Skip to main content</a>

    <!-- Dedicated Authentication Header: Logo on Left, Theme & RTL Toggles on Right -->
  <header class="auth-header">
    <div class="container d-flex align-items-center justify-content-end h-100">
      <div class="header-actions d-flex align-items-center gap-2">
        <button id="themeBtn" class="btn btn-icon theme-btn" type="button" aria-label="Toggle light and dark theme">🌙</button>
        <button id="dirBtn" class="btn btn-icon dir-btn" type="button" aria-label="Toggle right-to-left layout">RTL</button>
      </div>
    </div>
  </header>

  <!-- 2. Centered Login Card -->
  <main id="main" class="auth-main">
    <div class="auth-card card p-3 p-sm-4 reveal">
      <!-- Brand Mark & Heading Inside Card -->
      <div class="text-center mb-3">
        <div class="d-flex justify-content-center align-items-center mb-3">
          <a class="brand auth-card-logo d-inline-flex align-items-center justify-content-center text-decoration-none m-0" href="index.html" aria-label="Fiesta Rosa Events Home" id="authBrandLogo">
            <img src="assets/img/icons/logo-mark.svg" alt="Fiesta Rosa Logo Mark" class="brand-mark" width="42" height="42">
            <span class="brand-text">Fiesta<em>Rosa</em></span>
          </a>
        </div>
        <h1 class="h4 mb-1">Welcome Back</h1>
        <p class="muted small mb-0">Sign in to manage your celebration and planning details.</p>
      </div>

      <!-- Validated Login Form -->
      <form id="login" data-validate novalidate>
        <div class="mb-3">
          <label class="form-label" for="lemail">Email Address *</label>
          <input class="form-control" id="lemail" name="lemail" type="email" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center">
            <label class="form-label mb-0" for="lpass">Password *</label>
            <a href="#forgot" class="small text-decoration-none" id="forgotPassLink">Forgot Password?</a>
          </div>
          <div class="pass-wrap mt-1">
            <input class="form-control" id="lpass" name="lpass" type="password" placeholder="••••••••" required autocomplete="current-password">
            <button class="pass-toggle" type="button" data-target="#lpass" aria-label="Show password">Show</button>
          </div>
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="rememberMe">
          <label class="form-check-label small" for="rememberMe">Remember my device</label>
        </div>

        <div id="authMsg" class="alert alert-danger py-2 small" role="alert" hidden></div>

        <button class="btn btn-brand w-100" type="submit">Sign In</button>
      </form>

      <!-- Social Authentication Options -->
      <div class="auth-divider" role="separator" aria-label="Or continue with social provider">
        <span class="auth-divider-line"></span>
        <span class="auth-divider-text">or continue with</span>
        <span class="auth-divider-line"></span>
      </div>

      <div class="auth-social-btns">
        <button type="button" class="btn auth-social-btn flex-fill btn-social-google" data-provider="Google" aria-label="Sign in with Google">
          <svg class="auth-social-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.15z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.27v3.15C3.25 21.31 7.31 24 12 24z"/>
            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.27C.46 8.2 0 10.04 0 12s.46 3.8 1.27 5.42l4.01-3.15z"/>
            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.69 1.27 6.58l4.01 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
          </svg>
          <span class="auth-social-label">Google</span>
        </button>
        <button type="button" class="btn auth-social-btn flex-fill btn-social-apple" data-provider="Apple" aria-label="Sign in with Apple">
          <i class="bi bi-apple auth-social-icon" aria-hidden="true"></i>
          <span class="auth-social-label">Apple</span>
        </button>
      </div>

      <p class="text-center mt-3 mb-0 small">
        Don't have an account? <a href="register.html" class="fw-bold">Sign Up</a>
      </p>
    </div>
  </main>

  <!-- Reusable Authentication Status Modal -->
  <div class="modal fade" id="demoModal" tabindex="-1" aria-labelledby="demoModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content text-center p-4">
        <div class="modal-header border-0 pb-0 justify-content-end">
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body pt-0 pb-3">
          <div id="demoModalIcon" class="demo-modal-icon mx-auto mb-3">
            <i class="bi bi-check-circle-fill text-success fs-1"></i>
          </div>
          <span id="demoModalBadge" class="badge-gold mb-2">Notice</span>
          <h3 id="demoModalTitle" class="h4 mb-2">Notification</h3>
          <p id="demoModalMsg" class="mb-0 lead fs-6"></p>
        </div>
        <div class="modal-footer border-0 pt-0 justify-content-center">
          <button type="button" id="demoModalOkBtn" class="btn btn-brand px-4 py-2" data-bs-dismiss="modal">OK</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
